name: Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # The release workflow runs the native macOS tests; this covers the Python suite on Windows.
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulator test dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run the Python suite
        # faulthandler prints every thread's stack if one test runs longer than 5 minutes.
        # The Run D pilot tests start many processes, which is slow on Windows, so the full suite needs over an hour there.
        timeout-minutes: 150
        run: python -m pytest -q -rfE -o faulthandler_timeout=300
