name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#v}"
          fi
          version="${tag#v}"
          if [[ -z "$version" || "$version" =~ [[:space:]] ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run native tests
        working-directory: tools/macos/ZephyrMeshApp
        run: swift test
      - name: Build the local macOS bundle
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 tools/macos/build_app.py --version "$RELEASE_VERSION"
      - name: Package the macOS asset
        timeout-minutes: 10
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          platform_key="macos-${ARCHITECTURE}"
          python3 tools/package_release.py \
            --source "Zephyr Mesh.app" \
            --output release \
            --platform "$platform_key" \
            --version "$RELEASE_VERSION"
          archive="release/ZephyrMesh-${platform_key}-v${RELEASE_VERSION}.zip"
          unzip -t "$archive"
          smoke_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$smoke_dir"
          if [ -d tools/macos/ZephyrMeshApp/.build ]; then
            mv tools/macos/ZephyrMeshApp/.build "${smoke_dir}/swift-build-hidden"
            trap 'mv "${smoke_dir}/swift-build-hidden" tools/macos/ZephyrMeshApp/.build' EXIT
          fi
          # The same two checks the in-app updater runs before installing a release:
          # a release that fails either one could never be installed by it.
          codesign --verify --deep --strict "$smoke_dir/Zephyr Mesh.app"
          # perl's alarm survives exec, so a self-test that hangs (or opens a window) is killed after 60 s.
          perl -e 'alarm 60; exec @ARGV' "$smoke_dir/Zephyr Mesh.app/Contents/MacOS/ZephyrMeshApp" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.architecture }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulator test dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run the Python suite on Windows
        # A Tk test that hangs must fail the job, not stall it for six hours.
        # With Runs D, E and F the suite takes over an hour on a hosted Windows runner
        # (the Run D pilot tests start many processes, which is slow there).
        timeout-minutes: 150
        run: python -m pytest -q
      - name: Build and package the Windows preview
        shell: powershell
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          powershell -ExecutionPolicy Bypass -File tools/desktop/build_windows.ps1 -Python python -Output dist -Version "$env:RELEASE_VERSION" -Package
      - name: Validate the frozen Windows bundle
        run: python tools/validate_windows_bundle.py dist/ZephyrMeshWindows --gui-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-release-*
          path: release-assets/macos
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows
      - name: Build the public release manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/build_release_manifest.py \
            --version "$RELEASE_VERSION" \
            --repository "$REPOSITORY" \
            --output release-assets/release-manifest.json \
            release-assets/macos/*.zip release-assets/windows/*.zip
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Zephyr Mesh desktop preview

          This release contains the read-only synthetic replay cockpit for macOS and Windows.
          It does not connect to a radio, camera, motor, flight controller, or swarm.

          The ZIP assets are architecture-labeled and accompanied by SHA-256 sidecars and a release manifest.
          EOF
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Zephyr Mesh $RELEASE_TAG" \
              --notes-file release-notes.md \
              release-assets/macos/*.zip \
              release-assets/macos/*.sha256 \
              release-assets/windows/*.zip \
              release-assets/windows/*.sha256 \
              release-assets/release-manifest.json
          else
            gh release create "$RELEASE_TAG" \
              --title "Zephyr Mesh $RELEASE_TAG" \
              --notes-file release-notes.md \
              release-assets/macos/*.zip \
              release-assets/macos/*.sha256 \
              release-assets/windows/*.zip \
              release-assets/windows/*.sha256 \
              release-assets/release-manifest.json
          fi
